<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quarterly Tax Worksheet</title>
  <meta name="description" content="Unofficial bilingual (English/Filipino) practice worksheet for quarterly BIR returns 1701Q and 2551Q. Not a BIR form.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23237a6b'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="banner" role="note" id="banner"></div>

  <header class="top">
    <div class="wrap top-inner">
      <div class="brand">
        <h1 id="app-title"></h1>
        <p class="by" id="app-by"></p>
      </div>
      <div class="controls">
        <div class="lang" role="group" id="lang-group">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="fil">FIL</button>
        </div>
        <button type="button" class="icon-btn" id="theme-btn"></button>
        <button type="button" class="ghost-btn" id="start-over"></button>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <p class="tagline" id="tagline"></p>
    <div id="progress" class="progress" aria-live="polite"></div>
    <section id="screen" class="screen" tabindex="-1"></section>
    <p class="privacy" id="privacy"></p>
  </main>

  <footer class="foot">
    <div class="wrap" id="footer"></div>
  </footer>

  <script src="js/rules.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
